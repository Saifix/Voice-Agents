name: Deploy to droplet

# Push to main (or run manually) -> SSH into the droplet, pull the latest code,
# and rebuild/restart the stack. Secrets (.env) live on the droplet, not here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd /root/voice-agent
            git fetch --all --prune
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps
