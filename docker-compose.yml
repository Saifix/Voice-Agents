# Full stack: db (Postgres) + web (FastAPI app serving the React SPA) + caddy
# (HTTPS reverse proxy). One command runs everything:
#
#   docker compose up -d --build
#
# Requires a .env next to this file:
#   GEMINI_API_KEY=...                # injected as a Docker secret (not an env var)
#   SITE_ADDRESS=your-domain.com      # used by Caddy for automatic HTTPS
#
# Local development (run backend/frontend on the host) only needs Postgres:
#   docker compose up -d db           # exposes 127.0.0.1:5433

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    ports:
      - "127.0.0.1:5433:5432"   # localhost-only; for host-based local dev
    volumes:
      - voiceagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://voiceagent:voiceagent@db:5432/voiceagent
    secrets:
      - gemini_api_key
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  gemini_api_key:
    environment: GEMINI_API_KEY

volumes:
  voiceagent_pgdata:   # DB data — survives down/up; only removed by `down -v`
  caddy_data:
  caddy_config:
