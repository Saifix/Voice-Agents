services:
  db:
    image: postgres:16
    container_name: voiceagent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 may be used by other projects)
    volumes:
      - voiceagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceagent-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the backend reaches Postgres at db:5432.
      DATABASE_URL: postgresql+psycopg2://voiceagent:voiceagent@db:5432/voiceagent
    secrets:
      # The Gemini key is mounted as a read-only file at /run/secrets/gemini_api_key
      # (NOT a container env var, so it won't show up in `docker inspect`).
      - gemini_api_key
    ports:
      - "8000:8000"

# The secret value is taken from GEMINI_API_KEY in the project-root .env at
# `compose up` time and mounted into the container as a file — single source of
# truth, no key baked into the image.
secrets:
  gemini_api_key:
    environment: GEMINI_API_KEY

volumes:
  # Named volume — data survives `docker compose down` and `up`. It is ONLY
  # removed by an explicit `docker compose down -v` (or `docker volume rm`).
  voiceagent_pgdata:
